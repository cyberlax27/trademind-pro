services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 5000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      DB_PATH: /var/data/trademind.db
    volumes:
      - trademind-data:/var/data
    container_name: trademind-api
    command: npm start
    restart: unless-stopped

volumes:
  trademind-data:
